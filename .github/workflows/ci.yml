name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation et tests (Oracle lancé par Testcontainers)
        run: ./mvnw -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Résumé des erreurs
        if: failure()
        run: |
          grep -E '\[ERROR\]|Caused by|Tests run:' build.log | grep -v 'Re-run Maven\|Help 1\|-> \[Help' | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          for f in target/surefire-reports/*.txt; do [ -f "$f" ] && grep -A3 -E 'FAILURE|ERROR' "$f" | head -12 | while IFS= read -r l; do echo "::error::$(basename $f): ${l:0:400}"; done; done

      - name: Nombre de tests exécutés
        if: always()
        run: grep -E 'Tests run:' build.log | tail -1 | while IFS= read -r l; do echo "::notice::$l"; done
